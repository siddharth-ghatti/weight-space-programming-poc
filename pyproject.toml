[project]
name = "wsp"
version = "0.1.0"
description = "Weight-space programming POC: an LLM edits bert-base-uncased into an insurance sentence classifier without gradient descent"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "anthropic>=1.0",
    "torch>=2.4",
    "transformers>=4.45",
    "safetensors>=0.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "huggingface-hub>=0.25",
    "accelerate>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
