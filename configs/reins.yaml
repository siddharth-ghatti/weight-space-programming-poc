# Reinsurance pruning experiment (wspr). Override from the CLI: scripts/reins/run.py --name r1/p25 --passes 25
editor_model: claude-opus-5-5
effort: xhigh
max_tokens: 64000
thinking_display: summarized

model_dir: models/climatebert-tcfd   # the third-party checkpoint being shrunk (scripts/reins/fetch_model.py)
data_dir: data/tcfd                  # practice = dataset train split, test = dataset test split (scripts/reins/make_data.py)
accuracy_target: 0.765             # start accuracy 0.7750 - 0.01
macro_f1_target: 0.6896             # start macro-F1 0.7096 - 0.02

passes: 25
max_code_runs: 300
max_turns: 400
handoff_every: 40
dollar_cap: 150.0

sandbox:
  timeout_s: 900
  stdout_cap: 20000
  stderr_tail: 6000
  use_sandbox_exec: true

prices:
  input: 4.0
  output: 20.0
  cache_read: 0.20
  cache_write: 5.0
